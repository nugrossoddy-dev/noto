<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FAFAF7">
<title>NOTO</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root{--ac:#2E6B5A;--bg:#FAFAF7;--ink:#1E2022;--mu:#7A7F84;--ln:#ECEBE6}
*{-webkit-tap-highlight-color:transparent}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:96px}
main{padding:8px 22px 20px}
.ic{width:22px;height:22px}
.muted{color:var(--mu);font-size:.9rem}
.lbl{color:var(--mu);font-size:.85rem;margin-bottom:6px}
.big{font-size:1.9rem;font-weight:600;line-height:1.2;letter-spacing:-.02em;margin:0 0 6px}
.btn-noto{background:var(--ac);color:#fff;border:0;border-radius:14px;padding:.8rem 1.2rem;font-weight:500}
.btn-noto:active,.btn-noto:hover{background:var(--ac);color:#fff;opacity:.88}
.btn-soft{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:.75rem .5rem;font-weight:500;font-size:.9rem}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 22px 4px}
.top button,.link{background:0;border:0;color:var(--ink);padding:8px}
.bn{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:#fff;border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10}
.bn button{flex:1;background:0;border:0;padding:10px 0 8px;color:var(--mu);font-size:.68rem;display:flex;flex-direction:column;align-items:center;gap:2px}
.bn button.on{color:var(--ac);font-weight:600}
.fab{position:fixed;right:max(18px,calc(50vw - 242px));bottom:calc(84px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:18px;background:var(--ink);color:#fff;border:0;box-shadow:0 6px 18px #0002;z-index:9}
.ri{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--ln);touch-action:pan-y}
.ri .g{flex:1;min-width:0}.tt{font-weight:500}.done .tt{text-decoration:line-through;color:var(--mu)}
.cb{width:24px;height:24px;accent-color:var(--ac);flex:none}
.hi{width:8px;height:8px;border-radius:50%;background:var(--ac);flex:none}
.tabs{display:flex;gap:18px;margin:6px 0 4px;overflow:auto}
.tabs button{background:0;border:0;padding:8px 0;color:var(--mu);font-weight:500;border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-color:var(--ink)}
.ch{border:1px solid var(--ln);background:#fff;border-radius:12px;padding:.5rem .9rem}
.ch.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.bar{height:4px;background:var(--ln);border-radius:4px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--ac)}
.ins{border-left:2px solid var(--ac);padding:2px 0 2px 14px;margin:26px 0}
.sec{margin-top:28px}
.hero{margin:10px 22px 0;border-radius:18px;overflow:hidden;background:#8FB0BE;height:clamp(130px,40vw,190px)}
.hero img{display:block;width:100%;height:100%;object-fit:cover;object-position:center}
#sh{position:fixed;left:50%;bottom:0;width:100%;max-width:520px;transform:translate(-50%,105%);background:#fff;border-radius:24px 24px 0 0;padding:12px 22px calc(24px + env(safe-area-inset-bottom));z-index:30;transition:transform .25s;max-height:90vh;overflow:auto}
.so #sh{transform:translate(-50%,0)}
#bd{position:fixed;inset:0;background:#0006;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.so #bd{opacity:1;pointer-events:auto}
.grab{width:40px;height:4px;background:var(--ln);border-radius:4px;margin:0 auto 14px}
#tt{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:.85rem;opacity:0;transition:opacity .2s;z-index:50;pointer-events:none;max-width:88%;text-align:center}
#tt.on{opacity:1}
#fo{position:fixed;inset:0;background:#17181a;color:#fff;z-index:40;display:none;align-items:center;justify-content:center;text-align:center;padding:24px}
#fo.on{display:flex}
.clk{font-size:5.4rem;font-weight:200;font-variant-numeric:tabular-nums;letter-spacing:-.03em;margin:18px 0 6px}
.m2{color:#9aa0a6;font-size:.9rem}
.fob{display:flex;gap:12px;justify-content:center;margin-top:36px}.fob .btn{min-width:110px;border-radius:14px;padding:.8rem}
.sc{display:flex;gap:8px;margin-bottom:14px}.sc .ch{flex:1;padding:.6rem 0}
.form-control,.form-select{border-radius:12px}
.empty{text-align:center;padding:48px 0;color:var(--mu)}.empty b{display:block;color:var(--ink);font-size:1.1rem;margin-bottom:4px}
.kv{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--ln)}.kv span:first-child{color:var(--mu)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body>
<div id="app"></div>
<button class="fab" id="fab" aria-label="Add">+</button>
<nav class="bn" id="nav"></nav>
<div id="bd"></div><div id="sh"></div><div id="tt"></div><div id="fo"></div>

function suggest(due,imp,est){let s=0;const d=due?dd(due):9;s+=d<=0?3:d<=2?2:d<=5?1:0;if(imp)s+=2;if(est>=120)s+=1;if(active().length>8)s+=1;return s>=4?'High':s>=2?'Medium':'Low'}
const dueLbl=d=>!d?'No deadline':d<ymd()?'Overdue':d===ymd()?'Due today':d===addDays(1)?'Due tomorrow':'Due '+new Date(d+'T00:00').toLocaleDateString(undefined,{day:'numeric',month:'short'});
const sToday=()=>S.sessions.filter(x=>x.day===ymd());
function bestHour(){if(!S.sessions.length)return null;const b={};S.sessions.forEach(x=>{const k=Math.floor(x.hr/2)*2;b[k]=(b[k]||0)+x.min});return +Object.entries(b).sort((a,c)=>c[1]-a[1])[0][0]}
function streak(){const days=new Set([...S.sessions.map(x=>x.day),...S.tasks.filter(t=>t.done).map(t=>t.doneDay)]);let n=0,d=new Date();if(!days.has(ymd(d)))d.setDate(d.getDate()-1);while(days.has(ymd(d))){n++;d.setDate(d.getDate()-1)}return n}
function insight(){const c=S.checkins.filter(x=>x.day===ymd()).pop(),n=active().filter(t=>t.due&&t.due<=ymd()).length,b=bestHour();
 if(n>4)return 'You have several tasks today. Start with one small task.';
 if(c&&c.energy>=4)return 'Your energy is high today. Consider starting with your most demanding task.';
 if(c&&c.energy<=2)return 'Energy feels low. A short session on a small task can help.';
 if(b!=null)return `You usually focus better between ${pad(b)}:00–${pad(b+2)}:00.`;
 return 'Do a quick check-in to start seeing your productivity pattern.'}
function recs(){const r=[],m=S.sessions.filter(x=>x.hr<12),a=S.sessions.filter(x=>x.hr>=12),av=l=>l.reduce((s,x)=>s+x.min,0)/l.length;
 if(m.length&&a.length){if(av(m)>av(a))r.push('Your focus sessions are usually longer in the morning.','Try scheduling demanding tasks before noon.');else r.push('Your focus sessions are usually longer in the afternoon.')}
 const en={};S.checkins.forEach(c=>en[c.day]=c.energy);const hi=[],lo=[];Object.keys(en).forEach(d=>{const n=S.tasks.filter(t=>t.doneDay===d).length;(en[d]>=4?hi:lo).push(n)});
 const A=l=>l.reduce((s,x)=>s+x,0)/l.length;if(hi.length&&lo.length&&A(hi)>A(lo))r.push('You usually complete more tasks when your energy level is high.');
 if(S.checkins.filter(c=>c.stress>=4).length>=3)r.push('Stress has been high lately. Consider shorter sessions with breaks.');
 return r.length?r:['Use NOTO for a few days. Your productivity pattern will appear here.']}

/* ---------- ui helpers ---------- */
function sheet(h){$('#sh').innerHTML='<div class="grab"></div>'+h;document.body.classList.add('so')}
function closeSheet(){document.body.classList.remove('so')}
$('#bd').onclick=closeSheet;
let tmr;function toast(m){const t=$('#tt');t.textContent=m;t.classList.add('on');clearTimeout(tmr);tmr=setTimeout(()=>t.classList.remove('on'),2400)}
const pick=e=>{[...e.parentNode.children].forEach(c=>c.classList.remove('on'));e.classList.add('on')};
const val=id=>$(id).value.trim();
const empty=(a,b)=>`<div class="empty"><b>${a}</b>${b}</div>`;

/* ---------- views ---------- */
function vHome(){const t=next(),td=active().filter(x=>x.due&&x.due<=ymd()),dn=S.tasks.filter(x=>x.done&&x.doneDay===ymd()).length,tot=td.length+dn,est=td.reduce((a,x)=>a+(+x.est||0),0),h=new Date().getHours(),n=S.prefs.name;
 const g=(h<11?'Good morning':h<17?'Good afternoon':'Good evening')+(n?', '+esc(n):'')+'.';
 const ev=S.events.filter(e=>e.date>=ymd()).sort(cE)[0];
 return `<div class="top"><div class="muted">${new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})}</div><div><button onclick="searchSheet()" aria-label="Search">${ic('search')}</button><button onclick="settings()" aria-label="Settings">${ic('gear')}</button></div></div>
 <div class="hero"><img src="${HERO}" width="850" height="425" alt="Illustration of a busy person juggling many tasks" decoding="async"></div>
 <main><div class="lbl" style="margin-top:20px">${g}</div><div class="big" style="font-size:1rem;color:var(--mu);font-weight:400">What's next?</div>
 ${t?`<div class="big" style="font-size:2.1rem;margin-top:10px" onclick="taskSheet('${t.id}')">${esc(t.title)}</div><div class="muted">${dueLbl(t.due)} · ${t.pri} priority</div>
 <button class="btn btn-noto mt-4 w-100" onclick="focusSheet('${t.id}')">Start Focus</button>`:empty('Nothing planned yet.','Start with one small task.')+`<button class="btn btn-noto w-100" onclick="taskSheet()">Add a task</button>`}
 <div class="sec"><div class="lbl">Today</div><div>${tot?`${tot} task${tot>1?'s':''}${est?' · '+dur(est)+' estimated':''}`:'No tasks due'}</div>${tot?`<div class="bar"><i style="width:${Math.round(dn/tot*100)}%"></i></div><div class="muted mt-1">${dn} of ${tot} done</div>`:''}</div>
 ${ev?`<div class="sec"><div class="lbl">Upcoming</div><div>${esc(ev.title)}</div><div class="muted">${ev.date===ymd()?'Today':dueLbl(ev.date).replace('Due ','')}${ev.time?' · '+ev.time:''}</div></div>`:''}
 <div class="ins"><div class="lbl">AI Insight</div><div>“${insight()}”</div></div>
 <div class="row g-2"><div class="col-6"><button class="btn-soft w-100" onclick="taskSheet()">+ Add Task</button></div><div class="col-6"><button class="btn-soft w-100" onclick="noteSheet()">+ Add Note</button></div>
 <div class="col-6"><button class="btn-soft w-100" onclick="focusSheet()">Start Focus</button></div><div class="col-6"><button class="btn-soft w-100" onclick="checkin()">Check In</button></div></div></main>`}

function taskRow(t){return `<div class="ri ${t.done?'done':''}" data-id="${t.id}"><input type="checkbox" class="cb" ${t.done?'checked':''} onchange="toggle('${t.id}')"><div class="g" onclick="taskSheet('${t.id}')"><div class="tt">${esc(t.title)}</div><div class="muted">${[dueLbl(t.due),t.pri,t.est?t.est+'m':'',t.rep&&t.rep!=='none'?'↻ '+t.rep:'',esc(t.cat)].filter(Boolean).join(' · ')}</div></div>${t.pri==='High'&&!t.done?'<span class="hi"></span>':''}</div>`}
const cE=(a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||''));
function vTasks(){const td=ymd();let l,h;
 if(tt==='today')l=S.tasks.filter(t=>!t.done&&t.due&&t.due<=td).sort((a,b)=>score(b)-score(a));
 else if(tt==='upcoming')l=S.tasks.filter(t=>!t.done&&(!t.due||t.due>td)).sort((a,b)=>(a.due||'9').localeCompare(b.due||'9'));
 else if(tt==='done')l=S.tasks.filter(t=>t.done).sort((a,b)=>b.doneAt-a.doneAt);
 if(tt==='schedule'){const ev=S.events.filter(e=>e.date>=td).sort(cE);h=ev.length?ev.map(e=>`<div class="ri" onclick="eventSheet('${e.id}')"><div class="g"><div class="tt">${esc(e.title)}</div><div class="muted">${e.date===td?'Today':e.date===addDays(1)?'Tomorrow':dueLbl(e.date).replace('Due ','')}${e.time?' · '+e.time:''}</div></div></div>`).join(''):empty('Nothing scheduled.','Add an event when you need one.')}
 else h=l.length?l.map(taskRow).join(''):tt==='done'?empty('Nothing completed yet.','One task at a time.'):empty('Nothing planned yet.','Start with one small task.');
 return `<div class="top"><div class="big" style="margin:0">Tasks</div><button onclick="searchSheet()">${ic('search')}</button></div><main><div class="tabs">${[['today','Today'],['upcoming','Upcoming'],['done','Completed'],['schedule','Schedule']].map(([k,v])=>`<button class="${tt===k?'on':''}" onclick="tt='${k}';render()">${v}</button>`).join('')}</div>${h}</main>`}

function setupHTML(id){const list=active().sort((a,b)=>score(b)-score(a)),cur=S.tasks.find(t=>t.id===id),m=cur&&+cur.est>0?cur.est:25;
 return `<label class="muted">Task</label><select id="fsT" class="form-select mb-3"><option value="">No task · free focus</option>${list.map(t=>`<option value="${t.id}" ${t.id===id?'selected':''}>${esc(t.title)}</option>`).join('')}</select>
 <label class="muted">Duration (minutes)</label><div class="d-flex gap-2 mb-3"><button class="ch" onclick="$('#fsM').value=25">25</button><button class="ch" onclick="$('#fsM').value=50">50</button><input id="fsM" type="number" min="1" max="240" class="form-control" value="${m}" placeholder="Custom"></div>
 <button class="btn btn-noto w-100" onclick="beginFocus()">Start Focus</button>`}
function focusSheet(id,rec){sheet(`<h5 class="fw-semibold">Ready to focus?</h5><p class="muted">${rec?'Task added. Start now while it is fresh.':'Choose a task and set your time.'}</p>${setupHTML(id)}<button class="btn w-100 mt-1 text-muted" onclick="closeSheet()">${rec?'Later':'Cancel'}</button>`)}
function vFocus(){const s=sToday(),tot=s.reduce((a,x)=>a+x.min,0),t=next();
 return `<div class="top"><div class="big" style="margin:0">Focus</div><span></span></div><main><div class="lbl mt-3">One task at a time.</div><div class="big mb-4">Ready to focus?</div>${setupHTML(t&&t.id)}
 <div class="sec">${S.sessions.length?`<div class="kv"><span>Sessions today</span><span>${s.length}</span></div><div class="kv"><span>Focus time today</span><span>${dur(tot)}</span></div>`:empty('No focus sessions yet.','Start your first session.')}</div></main>`}

const nMatch=n=>{const q=($('#nq')?$('#nq').value:'').toLowerCase();return !q||(n.text+' '+n.tags.join(' ')).toLowerCase().includes(q)};
function nList(){const l=S.notes.filter(nMatch).sort((a,b)=>(b.pin-a.pin)||b.ts-a.ts);
 return l.length?l.map(n=>{const [f,...r]=n.text.split('\n');return `<div class="ri" onclick="noteSheet('${n.id}')"><div class="g"><div class="tt">${n.pin?'📌 ':''}${esc(f)}</div><div class="muted text-truncate">${esc(r.join(' ')||' ')}</div>${n.tags.length?`<div class="muted">${n.tags.map(t=>'#'+esc(t)).join(' ')}</div>`:''}</div></div>`}).join(''):empty('Your thoughts have a place.','Create your first note.')}
function vNotes(){return `<div class="top"><div class="big" style="margin:0">Notes</div><span></span></div><main><input id="nq" class="form-control my-3" placeholder="Search notes" oninput="$('#nl').innerHTML=nList()"><div id="nl">${nList()}</div></main>`}

function vIns(){const ss=S.sessions,tot=ss.reduce((a,x)=>a+x.min,0),dn=S.tasks.filter(t=>t.done),b=bestHour(),wd={},od={};
 [...dn.map(t=>t.doneDay),...ss.map(x=>x.day)].forEach(d=>{const w=new Date(d+'T00:00').toLocaleDateString('en',{weekday:'long'});wd[w]=(wd[w]||0)+1});
 active().filter(t=>t.due&&t.due<ymd()).forEach(t=>{const c=t.cat||'Uncategorized';od[c]=(od[c]||0)+1});
 const top=o=>Object.entries(o).sort((a,c)=>c[1]-a[1])[0],td=top(wd),to=top(od),pts=dn.length*10+Math.round(tot/5);
 const ach=[[dn.length>=1,'First task done'],[dn.length>=10,'10 tasks done'],[ss.length>=5,'5 focus sessions'],[streak()>=3,'3-day streak']].filter(a=>a[0]).map(a=>a[1]);
 const kv=(a,b)=>`<div class="kv"><span>${a}</span><span>${b}</span></div>`;
 return `<div class="top"><div class="big" style="margin:0">Insights</div><span></span></div><main>
 ${kv('Total focus time',dur(tot))}${kv('Focus sessions',ss.length)}${kv('Tasks completed',dn.length)}${kv('Best focus window',b==null?'—':pad(b)+':00–'+pad(b+2)+':00')}${kv('Most productive day',td?td[0]:'—')}${kv('Often delayed',to?to[0]:'—')}
 <div class="sec"><div class="lbl">Productivity pattern</div>${recs().map(r=>`<div class="ins" style="margin:10px 0">${r}</div>`).join('')}</div>
 <div class="sec"><div class="lbl">Progress</div>${kv('Daily streak',streak()+' day'+(streak()==1?'':'s'))}${kv('Points',pts)}${ach.length?`<div class="muted mt-2">${ach.join(' · ')}</div>`:''}</div>
 <button class="btn-soft w-100 mt-4" onclick="checkin()">Check In</button></main>`}

function render(){if(!U)return authView();const v={home:vHome,tasks:vTasks,focus:vFocus,notes:vNotes,insights:vIns}[tab];$('#app').innerHTML=v();
 $('#nav').innerHTML=NAV.map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')">${ic(k)}${l}</button>`).join('');
 $('#nav').style.display='';$('#fab').style.display=(tab==='focus'||tab==='insights')?'none':'';$('#fab').innerHTML=ic('plus')}
function go(t){tab=t;render();scrollTo(0,0)}
$('#fab').onclick=()=>tab==='notes'?noteSheet():tab==='tasks'&&tt==='schedule'?eventSheet():taskSheet();

/* ---------- tasks ---------- */
function taskSheet(id){const t=S.tasks.find(x=>x.id===id)||{due:ymd(),pri:'Medium'};manualPri=!!id;
 sheet(`<h5 class="fw-semibold mb-3">${id?'Edit task':'New task'}</h5><input id="fT" class="form-control form-control-lg mb-3" placeholder="What needs doing?" value="${esc(t.title)}">
 <div class="row g-2 mb-3"><div class="col-7"><label class="muted">Deadline</label><input id="fD" type="date" class="form-control" value="${t.due||''}" onchange="autoP()"></div><div class="col-5"><label class="muted">Estimate (min)</label><input id="fE" type="number" min="5" step="5" class="form-control" value="${t.est||''}" onchange="autoP()"></div></div>
 <label class="muted">Repeat</label><select id="fR" class="form-select mb-3">${[['none','Does not repeat'],['daily','Every day'],['weekdays','Weekdays'],['weekly','Every week'],['monthly','Every month']].map(([v,l])=>`<option value="${v}" ${(t.rep||'none')===v?'selected':''}>${l}</option>`).join('')}</select><label class="muted">Priority <span id="ph"></span></label><div class="d-flex gap-2 mb-3" id="fP">${['High','Medium','Low'].map(p=>`<button class="ch flex-fill ${p==t.pri?'on':''}" data-v="${p}" onclick="pick(this);manualPri=true">${p}</button>`).join('')}</div>
 <div class="form-check mb-3"><input id="fI" type="checkbox" class="form-check-input" ${t.imp?'checked':''} onchange="autoP()"><label class="form-check-label" for="fI">Important</label></div>
 <input id="fC" class="form-control mb-2" placeholder="Category (Study, Work…)" value="${esc(t.cat)}"><textarea id="fN" rows="2" class="form-control mb-3" placeholder="Short note">${esc(t.note)}</textarea>
 <button class="btn btn-noto w-100" onclick="saveTask('${id||''}')">${id?'Save':'Add task'}</button>${id?'':`<button class="btn w-100 mt-1" onclick="saveTask('',1)">Save &amp; add another</button>`}${id?`<button class="btn w-100 mt-1 text-danger" onclick="delTask('${id}')">Delete</button>`:''}`);
 if(!id)setTimeout(()=>{$('#fT').focus();autoP()},300)}
function autoP(){if(manualPri)return;const p=suggest($('#fD').value,$('#fI').checked,+$('#fE').value);[...$('#fP').children].forEach(c=>c.classList.toggle('on',c.dataset.v===p));$('#ph').textContent='· suggested '+p}
function saveTask(id,more){const title=val('#fT');if(!title)return toast('Add a title first.');
 const d={title,due:$('#fD').value,est:+$('#fE').value||0,pri:$('#fP .on').dataset.v,imp:$('#fI').checked,cat:val('#fC'),note:val('#fN'),rep:$('#fR').value};
 let t=S.tasks.find(x=>x.id===id);if(t)Object.assign(t,d);else{t={id:uid(),created:Date.now(),done:false,...d};S.tasks.push(t)}
 save();render();toast(id?'Saved.':'Task added.');if(more)return taskSheet();closeSheet();if(!id)setTimeout(()=>focusSheet(t.id,true),350)}
function delTask(id){if(!confirm('Delete this task?'))return;S.tasks=S.tasks.filter(t=>t.id!==id);save();closeSheet();render();toast('Deleted.')}
function nextDue(rep,base){const d=new Date((base||ymd())+'T00:00');const st=()=>{if(rep==='daily')d.setDate(d.getDate()+1);else if(rep==='weekly')d.setDate(d.getDate()+7);else if(rep==='monthly'){const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+1);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()))}else{do d.setDate(d.getDate()+1);while(d.getDay()%6===0)}};do st();while(ymd(d)<=ymd());return ymd(d)}
function toggle(id){const t=S.tasks.find(x=>x.id===id);t.done=!t.done;t.doneAt=t.done?Date.now():0;t.doneDay=t.done?ymd():'';let extra='';
 if(t.done&&t.rep&&t.rep!=='none'&&!t.spawned){const n={...t,id:uid(),done:false,doneAt:0,doneDay:'',spawned:'',created:Date.now(),due:nextDue(t.rep,t.due)};t.spawned=n.id;S.tasks.push(n);extra=' Next one: '+dueLbl(n.due).replace('Due ','')+'.'}
 else if(!t.done&&t.spawned){const n=S.tasks.find(x=>x.id===t.spawned);if(n&&!n.done)S.tasks=S.tasks.filter(x=>x!==n);t.spawned=''}
 save();render();toast(t.done?"Done. You're making progress."+extra:'Moved back to active.')}
let sx=0;document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{const r=e.target.closest&&e.target.closest('.ri[data-id]');if(r&&e.changedTouches[0].clientX-sx>90)toggle(r.dataset.id)},{passive:true});

/* ---------- events ---------- */
function eventSheet(id){const e=S.events.find(x=>x.id===id)||{date:ymd(),time:''};
 sheet(`<h5 class="fw-semibold mb-3">${id?'Edit event':'New event'}</h5><input id="eT" class="form-control form-control-lg mb-3" placeholder="Event" value="${esc(e.title)}"><div class="row g-2 mb-3"><div class="col-7"><input id="eD" type="date" class="form-control" value="${e.date}"></div><div class="col-5"><input id="eH" type="time" class="form-control" value="${e.time}"></div></div>
 <button class="btn btn-noto w-100" onclick="saveEv('${id||''}')">Save</button>${id?`<button class="btn w-100 mt-1 text-danger" onclick="delEv('${id}')">Delete</button>`:''}`)}
function saveEv(id){const title=val('#eT');if(!title||!$('#eD').value)return toast('Add a title and date.');const d={title,date:$('#eD').value,time:$('#eH').value};
 const e=S.events.find(x=>x.id===id);if(e)Object.assign(e,d);else S.events.push({id:uid(),...d});save();closeSheet();render();toast('Saved.')}
function delEv(id){if(!confirm('Delete this event?'))return;S.events=S.events.filter(e=>e.id!==id);save();closeSheet();render()}

/* ---------- notes ---------- */
function noteSheet(id){const n=S.notes.find(x=>x.id===id)||{text:'',tags:[],pin:false};
 sheet(`<h5 class="fw-semibold mb-3">${id?'Edit note':'New note'}</h5><textarea id="nT" rows="6" class="form-control mb-2" placeholder="Capture first, organize later.">${esc(n.text)}</textarea><input id="nG" class="form-control mb-2" placeholder="Tags (comma separated)" value="${esc(n.tags.join(', '))}">
 <div class="form-check mb-3"><input id="nP" type="checkbox" class="form-check-input" ${n.pin?'checked':''}><label class="form-check-label" for="nP">Pin</label></div>
 <button class="btn btn-noto w-100" onclick="saveNote('${id||''}')">Save</button>${id?`<button class="btn w-100 mt-1 text-danger" onclick="delNote('${id}')">Delete</button>`:''}`);if(!id)setTimeout(()=>$('#nT').focus(),300)}
function saveNote(id){const text=val('#nT');if(!text)return toast('Write something first.');const tags=val('#nG').split(/[,\s]+/).map(t=>t.replace('#','')).filter(Boolean),d={text,tags,pin:$('#nP').checked};
 const n=S.notes.find(x=>x.id===id);if(n)Object.assign(n,d);else S.notes.push({id:uid(),ts:Date.now(),...d});save();closeSheet();render();toast('Note saved.')}
function delNote(id){if(!confirm('Delete this note?'))return;S.notes=S.notes.filter(n=>n.id!==id);save();closeSheet();render()}

/* ---------- check-in ---------- */
function checkin(){const row=(k,l)=>`<div class="lbl">${l}</div><div class="sc" data-k="${k}">${[1,2,3,4,5].map(i=>`<button class="ch ${i==3?'on':''}" data-v="${i}" onclick="pick(this)">${i}</button>`).join('')}</div>`;
 sheet(`<h5 class="fw-semibold mb-1">Quick check-in</h5><p class="muted">1 is low, 5 is high.</p>${row('mood','Mood')}${row('energy','Energy')}${row('stress','Stress')}<button class="btn btn-noto w-100" onclick="saveCheck()">Save</button>`)}
function saveCheck(){const c={day:ymd(),ts:Date.now()};document.querySelectorAll('.sc').forEach(s=>c[s.dataset.k]=+s.querySelector('.on').dataset.v);S.checkins.push(c);save();closeSheet();render();toast(insight())}

/* ---------- search / settings ---------- */
function searchSheet(){sheet(`<input id="gq" class="form-control form-control-lg mb-2" placeholder="Search tasks, notes, schedule" oninput="gs()"><div id="gr"></div>`);setTimeout(()=>$('#gq').focus(),300)}
function gs(){const q=val('#gq').toLowerCase();if(!q){$('#gr').innerHTML='';return}
 const r=[...S.tasks.filter(t=>(t.title+t.note+t.cat).toLowerCase().includes(q)).map(t=>['Task',t.title,`taskSheet('${t.id}')`]),...S.notes.filter(n=>(n.text+n.tags).toLowerCase().includes(q)).map(n=>['Note',n.text.split('\n')[0],`noteSheet('${n.id}')`]),...S.events.filter(e=>e.title.toLowerCase().includes(q)).map(e=>['Schedule',e.title,`eventSheet('${e.id}')`])];
 $('#gr').innerHTML=r.length?r.map(x=>`<div class="ri" onclick="${x[2]}"><div class="g"><div class="tt">${esc(x[1])}</div><div class="muted">${x[0]}</div></div></div>`).join(''):'<div class="empty">No results.</div>'}
function settings(){sheet(`<h5 class="fw-semibold mb-1">Settings</h5><div class="muted mb-3">Signed in as ${esc(U.name)}</div><label class="muted">Your name</label><input id="sN" class="form-control mb-3" value="${esc(S.prefs.name)}">
 <button class="btn-soft w-100 mb-2" onclick="askNotif()">Enable reminders</button><button class="btn btn-noto w-100" onclick="S.prefs.name=val('#sN');save();closeSheet();render()">Save</button>
 <button class="btn-soft w-100 mt-2" onclick="logout()">Log out</button><button class="btn w-100 mt-1 text-danger" onclick="eraseMe()">Erase my data</button><div class="muted text-center mt-2">NOTO · Get Things Done · data stays on this device</div>`)}
function askNotif(){if(!('Notification' in window))return toast('Notifications are not supported here.');Notification.requestPermission().then(p=>toast(p==='granted'?'Reminders enabled.':'Reminders are off.'))}
function notify(t,b){if(!('Notification' in window)||Notification.permission!=='granted')return;navigator.serviceWorker&&navigator.serviceWorker.ready.then(r=>r.showNotification(t,{body:b,icon:'icon.svg',tag:'noto'})).catch(()=>{})}

/* ---------- focus timer (timestamp based: stays accurate in background) ---------- */
function beginFocus(){const m=Math.min(240,Math.max(1,+$('#fsM').value||25));F={taskId:$('#fsT').value,plan:m*60000,endAt:Date.now()+m*60000,rem:m*60000,state:'run',startTs:Date.now()};saveF();closeSheet();
 if('Notification' in window&&Notification.permission==='default')Notification.requestPermission();foRender()}
function foRender(){const o=$('#fo');clearInterval(iv);if(!F){o.classList.remove('on');return}o.classList.add('on');const t=S.tasks.find(x=>x.id===F.taskId);
 o.innerHTML=`<div><div class="m2">${F.state==='run'?'Focusing on':'Paused'}</div><h2 class="fw-semibold mt-1">${esc(t?t.title:'Free focus')}</h2><div id="clk" class="clk"></div><div id="elp" class="m2"></div>
 <div class="fob">${F.state==='run'?'<button class="btn btn-light" onclick="pauseF()">Pause</button>':'<button class="btn btn-light" onclick="resumeF()">Resume</button>'}<button class="btn btn-outline-light" onclick="finishF(false)">End</button></div></div>`;iv=setInterval(tick,250);tick()}
function tick(){if(!F)return;if(F.state==='run')F.rem=F.endAt-Date.now();if(F.rem<=0){finishF(true);return}const s=Math.ceil(F.rem/1000);
 $('#clk')&&($('#clk').textContent=pad(Math.floor(s/60))+':'+pad(s%60));$('#elp')&&($('#elp').textContent=`${dur(F.plan/60000)} session · ${dur((F.plan-F.rem)/60000)} done`)}
function pauseF(){F.rem=F.endAt-Date.now();F.state='pause';saveF();foRender()}
function resumeF(){F.endAt=Date.now()+F.rem;F.state='run';saveF();foRender()}
function finishF(full){const f=F;if(!f)return;const el=(f.plan-Math.max(0,f.state==='run'?f.endAt-Date.now():f.rem))/60000,min=full?f.plan/60000:Math.round(el*10)/10;
 F=null;saveF();foRender();if(min>=0.5)S.sessions.push({id:uid(),taskId:f.taskId,day:ymd(),hr:new Date(f.startTs).getHours(),min,plan:f.plan/60000});save();
 if(full){notify('Session complete','Well done. Take a break.');navigator.vibrate&&navigator.vibrate([200,100,200])}
 const s=sToday(),tot=s.reduce((a,x)=>a+x.min,0),t=S.tasks.find(x=>x.id===f.taskId);render();
 sheet(`<div class="text-center py-2"><div style="font-size:2.4rem">🎉</div><h4 class="fw-semibold mt-2">${full?'Congratulations!':'Nice effort.'}</h4><p class="muted mb-4">${full?'You did great work today. Every session counts.':'Every minute counts. You’re making progress.'}</p></div>
 <div class="kv"><span>This session</span><span>${dur(min)}</span></div><div class="kv"><span>Sessions today</span><span>${s.length}</span></div><div class="kv"><span>Focus time today</span><span>${dur(tot)}</span></div>
 ${t&&!t.done?`<button class="btn btn-noto w-100 mt-4" onclick="toggle('${t.id}');closeSheet()">Mark “${esc(t.title.slice(0,28))}” complete</button><button class="btn w-100 mt-1" onclick="closeSheet()">Not yet · take a break</button>`:`<button class="btn btn-noto w-100 mt-4" onclick="closeSheet()">Take a break</button>`}`)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});

/* ---------- accounts (local, on-device) ---------- */
async function hsh(p,s){const d=s+p;if(crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(d));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}let h=5381;for(const c of d)h=(h*33^c.charCodeAt(0))>>>0;return 'x'+h}
const aerr=m=>{$('#aE').textContent=m};
function authView(){$('#nav').style.display=$('#fab').style.display='none';const reg=authMode==='register'||!accts().length;
 $('#app').innerHTML=`<main style="padding-top:12vh"><div class="big" style="font-size:2.4rem">noto</div><div class="muted mb-5">Get Things Done</div>
 <div class="tabs">${accts().length?`<button class="${reg?'':'on'}" onclick="authMode='login';render()">Log in</button>`:''}<button class="${reg?'on':''}" onclick="authMode='register';render()">Create account</button></div>
 <input id="aU" class="form-control form-control-lg mt-3 mb-2" placeholder="Username" autocapitalize="none" autocomplete="username">
 <input id="aP" type="password" class="form-control form-control-lg mb-2" placeholder="Password${reg?' (min. 6 characters)':''}" autocomplete="${reg?'new-password':'current-password'}">
 ${reg?'<input id="aP2" type="password" class="form-control form-control-lg mb-2" placeholder="Repeat password" autocomplete="new-password">':''}
 <div id="aE" class="text-danger small mb-2" style="min-height:1.3em"></div>
 <button class="btn btn-noto w-100" onclick="${reg?'doReg()':'doLogin()'}">${reg?'Create account':'Log in'}</button>
 <div class="muted mt-4 text-center">Your account and data stay on this device and work offline.</div></main>`}
async function doReg(){const n=val('#aU'),p=$('#aP').value;if(n.length<3)return aerr('Username needs at least 3 characters.');if(p.length<6)return aerr('Password needs at least 6 characters.');if(p!==$('#aP2').value)return aerr('Passwords do not match.');
 const l=accts();if(l.some(a=>a.name.toLowerCase()===n.toLowerCase()))return aerr('That username is taken.');
 const salt=uid()+uid(),u={id:uid()+uid(),name:n,salt,hash:await hsh(p,salt)};l.push(u);localStorage.setItem(AK,JSON.stringify(l));
 const old=localStorage.getItem('noto_v1');if(old&&l.length===1){localStorage.setItem('noto_v1_'+u.id,old);localStorage.removeItem('noto_v1');const of=localStorage.getItem('noto_focus_v1');if(of){localStorage.setItem('noto_focus_v1_'+u.id,of);localStorage.removeItem('noto_focus_v1')}}
 enter(u,true)}
async function doLogin(){const n=val('#aU').toLowerCase(),u=accts().find(a=>a.name.toLowerCase()===n);if(!u||await hsh($('#aP').value,u.salt)!==u.hash)return aerr('Wrong username or password.');enter(u)}
function enter(u,isNew){localStorage.setItem(SK,u.id);loadUser(u);if(isNew&&!S.prefs.name){S.prefs.name=u.name;save()}start()}
function logout(){localStorage.removeItem(SK);U=null;F=null;foRender();closeSheet();authMode='login';render()}
function eraseMe(){if(!confirm('Erase all data for this account? This cannot be undone.'))return;localStorage.removeItem(K);localStorage.removeItem(FK);S=blank();S.prefs.name=U.name;F=null;foRender();closeSheet();save();start()}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!U){const b=document.querySelector('.btn-noto');b&&b.click()}});

/* ---------- init ---------- */
function start(){render();if(F)foRender();if(active().filter(t=>t.due&&t.due<=ymd()).length>4&&S.prefs.nudge!==ymd()){S.prefs.nudge=ymd();save();setTimeout(()=>toast('You have several tasks today. Start with one small task.'),600)}}
{const u=accts().find(a=>a.id===localStorage.getItem(SK));if(u)loadUser(u);start()}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
